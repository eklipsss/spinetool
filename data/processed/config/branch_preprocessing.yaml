# Branch preprocessing for modules T and P (docs/neuron-model/tp-branch-preprocessing.md).
# All lengths in nanometres. Paths/parallelism are CLI flags (scripts/neuron_model/run_branch_preprocessing.py);
# only the algorithm parameters below enter the config hash (a neuron is redone when they change).
#
# Windows (full Minnie65): --raw-data-root O:\Datasets --metadata-root O:\Datasets --output-root C:\... --workers 8
#   input ~220 MB per neuron (branch meshes + spine meshes + limb skeletons) -> ~160 GB from the NAS,
#   i.e. the run is bound by the NAS read throughput (~4 MB/s measured): plan for one night.
#   Output (npz + parquet) is small (a few GB): put it on the LOCAL disk (--output-root C:/...), not on the NAS
#   (~2 files per merged branch, ~110 000 small files; the fit scripts read them back). mac: a few branches, workers 1.

shaft:
  vertex_decimals: 3               # spine vertices matched by coordinates rounded to 1e-3 nm

centerline:
  initial_step_nm: 500.0           # resampling of the raw skeleton (orders the sections only)
  tangent_half_window_nm: 1500.0   # tangent from points +-1.5 um away (raw skeleton wobbles with the membrane)
  slab_half_thickness_nm: 150.0
  max_section_radius_nm: 1200.0    # verified on branches with r ~ 270 nm
  adaptive_max_radius_factor: 4.5  # 2nd pass with max(1200, 4.5 r_med) for thick branches (NOT verified yet; 0 = off)
  cluster_eps_nm: 150.0
  robust_k: 0.35
  min_section_points: 10
  large_radius_factor: 1.5
  kink_factor: 0.5
  end_distance_factor: 2.0         # sections closer than 2 r_med to an end are unreliable (branching region)
  outside_mesh_check: true
  centerline_smoothing_nm: 1000.0  # smoothing-spline kernel width (lam = h^4 / spacing). GCV picks lam ~ 0 here
                                   # (interpolates the fitting noise). On 2 real branches: h=1000 -> RMS to the
                                   # centres 0.5-0.6 r, twist <= 1.2e-6/nm, round trip 0.1-0.2 um; 2000 -> ~1 r off.
  radius_smoothing_nm: 1000.0
  spline_rms_factor: 0.75          # QC: RMS distance of the smoothed line to the reliable centres <= 0.75 r_med
  min_reliable_sections: 5
  long_gap_nm: 3000.0

grid_and_frame:
  node_step_nm: 500.0              # M = ceil(L / 500 nm) + 1 nodes, exact length
  straight_fraction: 0.02          # bend reference unless the max deviation from the chord < 2 % of L
  twist_tolerance_per_nm: 1.0e-5   # numerical twist of the discrete RMF; ~1e-6/nm at h = 1000 nm

joining_and_soma:
  join_distance_nm: 500.0
  soma_mismatch_fraction: 0.2      # cross-check against merged_branches.csv soma_midpoint_um (Minnie65)

spines:
  end_clamp_factor: 0.5            # projection beyond an end by > 0.5 r -> projects_to_end (not counted in N)
  position_outlier_factor: 0.75    # | |v_perp| - r(s) | > 0.75 r(s) -> position_outlier (counted, no position)

eligibility:                       # initial values, to be refined by the audit
  length_min_t_nm: 5000.0
  length_max_t_nm: 255500.0
  length_min_p_nm: 2000.0
  invalid_section_fraction_max: 0.2
  radius_min_nm: 80.0
  radius_max_nm: 1500.0
  trim_max_nm: 2000.0
  unknown_fraction_max: 0.1
  position_fraction_min: 0.9
