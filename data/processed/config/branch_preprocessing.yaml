# Branch preprocessing for modules T and P (docs/neuron-model/tp-branch-preprocessing.md).
# All lengths in nanometres. Paths/parallelism are CLI flags (scripts/neuron_model/run_branch_preprocessing.py);
# only the algorithm parameters below enter the config hash (a neuron is redone when they change).
#
# Windows (full Minnie65): --raw-data-root O:\Datasets --metadata-root <repo>\datasets --output-root C:\... --workers 8
#   input ~220 MB per neuron (branch meshes + spine meshes + limb skeletons) -> ~160 GB from the NAS,
#   i.e. the run is bound by the NAS read throughput (~4 MB/s measured): plan for one night.
#   Output (npz + parquet) is small (a few GB): put it on the LOCAL disk (--output-root C:/...), not on the NAS
#   (~2 files per merged branch, ~110 000 small files; the fit scripts read them back). mac: a few branches, workers 1.

shaft:
  vertex_decimals: 3               # spine vertices matched by coordinates rounded to 1e-3 nm

centerline:
  initial_step_nm: 500.0           # resampling of the raw skeleton (orders the sections only)
  tangent_half_window_nm: 1500.0   # tangent from points +-1.5 um away (raw skeleton wobbles with the membrane)
  slab_half_thickness_nm: 150.0
  max_section_radius_nm: 1200.0    # verified on branches with r ~ 270 nm
  adaptive_max_radius_factor: 4.5  # 2nd pass with max(1200, 4.5 r_med) for thick branches (NOT verified yet; 0 = off)
  cluster_eps_nm: 150.0
  robust_k: 0.35
  min_section_points: 10
  large_radius_factor: 1.5
  kink_factor: 0.5
  kink_floor_nm: 150.0             # the deviation of a centre from its neighbours' midpoint is ~70-90 nm (median) at ANY radius: a limit
                                   # 0.5 r alone flagged 65-70 % of the sections of branches with r < 200 nm (none usable). With 150 nm:
                                   # 14-19 % in every class. NOT only measurement noise: the independent CGAL skeleton shows the same
                                   # sub-micron wiggles of thin dendrites (scripts/neuron_model/compare_centerline_cgal.py, CLAUDE.md).
  end_distance_factor: 2.0         # sections closer than 2 r_med to an end are unreliable (branching region)
  outside_mesh_check: true
  centerline_smoothing_nm: 1000.0  # smoothing-spline kernel width (lam = h^4 / spacing). GCV picks lam ~ 0 here
                                   # (interpolates the fitting noise). On 2 real branches: h=1000 -> RMS to the
                                   # centres 0.5-0.6 r, twist <= 1.2e-6/nm, round trip 0.1-0.2 um; 2000 -> ~1 r off.
  # ADAPTIVE width (2026-10-20): h = clip(factor * r_med, min, centerline_smoothing_nm). Thin dendrites (r ~ 120 nm) wind on a
  # sub-micron scale comparable to r (seen by our sections AND by the CGAL skeleton): with h = 1000 nm the line was inside the
  # mesh at ~28 % of the points, with h = 250 nm at ~77 % (scripts/neuron_model/study_centerline_smoothing.py, 10 local thin
  # branches). factor 2 is PROVISIONAL - set it from the study on ~10 neurons (Windows). 0 = the fixed width above.
  centerline_smoothing_factor: 2.0
  centerline_smoothing_min_nm: 250.0
  radius_smoothing_nm: 1000.0
  spline_rms_factor: 0.75          # QC: RMS distance of the smoothed line to the reliable centres <= max(0.75 r_med, floor)
  spline_rms_floor_nm: 200.0       # the deviation of the smoothed line from the centres (~70-140 nm) does not scale with r: with 0.75 r alone
                                   # 56 of 94 branches of the pilot neuron failed (13 with 200). CAUTION: on thin branches (r ~ 120 nm) a line smoothed over
                                   # 1 um leaves the tube most of the time (see CLAUDE.md, CGAL comparison): this limit admits them
  min_reliable_sections: 5
  long_gap_nm: 3000.0

grid_and_frame:
  node_step_nm: 500.0              # M = ceil(L / step) + 1 nodes, exact length; the maximum when adaptive
  node_step_per_smoothing: 0.5     # step = clip(0.5 h, node_step_min_nm, node_step_nm): the nodes must resolve what the line keeps
  node_step_min_nm: 250.0          # (thin branches: 250 nm, thick: 500 nm); 0 = the fixed step above
  max_nodes: 512                   # T representation M_MAX: longer branches get a proportionally larger step
  straight_fraction: 0.02          # bend reference unless the max deviation from the chord < 2 % of L
  twist_tolerance_per_nm: 1.0e-5   # numerical twist of the discrete RMF; ~1e-6/nm at h = 1000 nm

joining_and_soma:
  join_distance_nm: 500.0
  soma_mismatch_fraction: 0.2      # cross-check against merged_branches.csv soma_midpoint_um (Minnie65)

spines:
  end_clamp_factor: 0.5            # projection beyond an end by > 0.5 r -> projects_to_end (not counted in N)
  position_outlier_factor: 0.75    # | |v_perp| - r(s) | > max(0.75 r(s), floor) -> position_outlier (counted, no position)
  position_outlier_floor_nm: 0.0   # set from the pilot (summarize_branches.py, per-spine block): the line is ~140 nm off the centres on thin branches

eligibility:                       # initial values, to be refined by the audit
  length_min_t_nm: 5000.0
  length_max_t_nm: 255500.0
  length_min_p_nm: 2000.0
  invalid_section_fraction_max: 0.4   # pilot neuron, T-eligible of 94 ok branches: 0.2 -> 32, 0.3 -> 55, 0.4 -> 63, 0.5 -> 65 (the gain flattens)
  radius_min_nm: 80.0
  radius_max_nm: 1500.0
  trim_max_nm: 2000.0
  unknown_fraction_max: 0.1
  centerline_inside_min: 0.0       # QC: share of the node polyline inside the mesh (row centerline_inside_fraction); set from the study
  position_fraction_min: 0.9
