# T0 (statistical trunk model, t-module-technical-spec.md section 4). CPU, minutes. Units: nm.
#   python scripts/neuron_model/fit_t0.py --config configs/neuron-model/trunk/t0.yaml data.branches_root=C:/.../preprocessed_branches
seed: 20260929
runs_root: runs/training/neuron-model
name: t0

data:
  branches_root: null              # output root of run_branch_preprocessing.py (branches.parquet + per-neuron geometry)
  pack_dir: data/interim/neuron-model/branch_pack/minnie65   # LOCAL copy of the node arrays (read once from the NAS)
  splits: null                     # only if the preprocessing ran without --splits
  io_threads: 16
  train_splits: [train]
  val_splits: [val]
  exclude_compartments: [axon_like]  # user decision 2026-10-20: dendrites only (axon_like is not a condition category, it was pooled with unknown); [] = keep
  max_val_branches: 3000           # generation + functionals on at most this many validation branches

model:
  mean_models: [parabola, gam]
  shrinkage_std: 0.3
  direction: tilt                  # tilt: heading relaxes to the branch axis (bounded tortuosity); kappa: OU on the bending (old, tortuosity grows with L)
  radius_residual: multiscale      # multiscale: two AR(1) scales + noise fitted to the semivariogram, amplitude = random effect of the branch (default since 2026-10-28; full-data diagnose_radius.py: one scale lost the 0.5-8 um variation); branch: ONE AR(1) with the branch amplitude; pooled: the joint OU (old)
  max_iter: 200
  length_bounds_nm: [5000.0, 255500.0]
