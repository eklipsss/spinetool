# Model C with the geometric regularisers ON FROM STEP 0 (the working recipe, 2026-10-18).
# Same 50 validation spines, step 30 000 (cache of 15 000 train spines, splits_dev_100n):
#   regularisers switched on at step 30 000 of a baseline run (eikonal/normal 0.1 -> 1.0 -> 0.3): valid raw meshes 4 %,
#     Chamfer-L1 255 nm, F@50 0.35 - the decoder had learnt a rippled field (cos(grad, normal) 0.17) and the late
#     regularisers only traded surface accuracy for smoothness;
#   this config from step 0: valid raw meshes 74 %, single component 74 %, Chamfer-L1 45 nm, HD95 126 nm, F@50 0.69,
#     cos(grad, normal) 0.80, latent no longer one-dimensional (top PC 26 % instead of 88 %).
#   + cosine lr decay 1e-4 -> 1e-5 over the same 30 000 steps (the constant-lr run plateaued from step ~30 000 on):
#     valid raw meshes 90 %, Chamfer-L1 31 nm, HD95 90 nm, F@50 0.84, spine = largest component in 98 %; val surface
#     loss 0.030 (0.037 at constant lr). A wider decoder (hidden_dim 512) was WORSE at constant lr (val surface 0.047).
defaults: [baseline.yaml]
name: vae-reg

data:
  batch_size: 16           # BatchNorm in the encoder and over mu needs >= 16

loss:
  eikonal: 0.1
  normal: 0.3

optimizer:
  schedule: {type: cosine, min_lr: 1.0e-5}   # total_steps = train.max_steps; set train.max_steps for the run you want
